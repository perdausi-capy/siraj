# Siraj short addresses (/home, /courses/12, /learn/40, /quiz/35, /admin/logos ...) -> the real pages. Keep in step with
# local_siraj/classes/clean_urls.php (PAGES).

rewrite ^/home/?$ /local/siraj/index.php last;
rewrite ^/learning/?$ /local/siraj/learning.php last;
rewrite ^/explore/?$ /local/siraj/explore.php last;
rewrite ^/courses/?$ /local/siraj/course.php last;
rewrite ^/courses/([0-9]+)/?$ /local/siraj/course.php?id=$1 last;
rewrite ^/learn/?$ /local/siraj/learn.php last;
rewrite ^/learn/([0-9]+)/?$ /local/siraj/learn.php?cmid=$1 last;
rewrite ^/achievements/?$ /local/siraj/achievements.php last;
rewrite ^/certificates/?$ /local/siraj/certificate.php last;
rewrite ^/certificates/([0-9]+)/?$ /local/siraj/certificate.php?id=$1 last;
rewrite ^/verify/?$ /local/siraj/verify.php last;
rewrite ^/verify/([A-Za-z0-9_-]+)/?$ /local/siraj/verify.php?code=$1 last;
rewrite ^/grades/?$ /local/siraj/grades.php last;
rewrite ^/grades/([0-9]+)/?$ /local/siraj/grades.php?id=$1 last;
rewrite ^/inbox/?$ /local/siraj/inbox.php last;
rewrite ^/messages/?$ /local/siraj/messages.php last;
rewrite ^/profile/?$ /local/siraj/profile.php last;
rewrite ^/team/?$ /local/siraj/team.php last;
rewrite ^/people/?$ /local/siraj/person.php last;
rewrite ^/people/([0-9]+)/?$ /local/siraj/person.php?id=$1 last;
rewrite ^/teaching/?$ /local/siraj/teaching.php last;
rewrite ^/studio/?$ /local/siraj/studio.php last;
rewrite ^/reports/?$ /local/siraj/reports.php last;
rewrite ^/matrix/?$ /local/siraj/matrix.php last;
# Moodle's own pages.
rewrite ^/calendar/(month|day|upcoming)/?$ /calendar/view.php?view=$1 last;
rewrite ^/(assign|bigbluebuttonbn|book|choice|data|feedback|folder|forum|glossary|h5pactivity|imscp|lesson|lti|page|quiz|resource|scorm|url|wiki|workshop)/([0-9]+)/?$ /mod/$1/view.php?id=$2 last;
rewrite ^/user/([0-9]+)/?$ /user/profile.php?id=$1 last;
rewrite ^/admin/search/?$ /admin/search.php last;
# A settings page by its name (/admin/logos), unless that name is a real file or folder in /admin.
if (!-e $request_filename) { rewrite ^/admin/([a-z0-9_]+)/?$ /admin/settings.php?section=$1 last; }
# Sign-in page: plain visits to /login/index.php show as /login/ (form posts and links with parameters untouched).
set $siraj_login "";
if ($request_uri = "/login/index.php") { set $siraj_login A; }
if ($request_method = GET) { set $siraj_login "${siraj_login}G"; }
if ($siraj_login = AG) { return 301 /login/; }
