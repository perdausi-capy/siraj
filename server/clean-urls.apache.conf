# Siraj short addresses (/home, /courses/12, /learn/40, /quiz/35, /admin/logos ...) -> the real pages. Keep in step with
# local_siraj/classes/clean_urls.php (PAGES).

<IfModule !rewrite_module>
    LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
</IfModule>
<Directory /var/www/html>
    RewriteEngine On
    # Sign-in page: plain visits to /login/index.php show as /login/ (form posts and links with parameters untouched).
    RewriteCond %{THE_REQUEST} ^GET\ /login/index\.php\ HTTP
    RewriteRule ^login/index\.php$ /login/ [R=301,L]
    RewriteRule ^home/?$ /local/siraj/index.php [QSA,L]
    RewriteRule ^learning/?$ /local/siraj/learning.php [QSA,L]
    RewriteRule ^explore/?$ /local/siraj/explore.php [QSA,L]
    RewriteRule ^courses/?$ /local/siraj/course.php [QSA,L]
    RewriteRule ^courses/([0-9]+)/?$ /local/siraj/course.php?id=$1 [QSA,L]
    RewriteRule ^learn/?$ /local/siraj/learn.php [QSA,L]
    RewriteRule ^learn/([0-9]+)/?$ /local/siraj/learn.php?cmid=$1 [QSA,L]
    RewriteRule ^achievements/?$ /local/siraj/achievements.php [QSA,L]
    RewriteRule ^certificates/?$ /local/siraj/certificate.php [QSA,L]
    RewriteRule ^certificates/([0-9]+)/?$ /local/siraj/certificate.php?id=$1 [QSA,L]
    RewriteRule ^verify/?$ /local/siraj/verify.php [QSA,L]
    RewriteRule ^verify/([A-Za-z0-9_-]+)/?$ /local/siraj/verify.php?code=$1 [QSA,L]
    RewriteRule ^grades/?$ /local/siraj/grades.php [QSA,L]
    RewriteRule ^grades/([0-9]+)/?$ /local/siraj/grades.php?id=$1 [QSA,L]
    RewriteRule ^inbox/?$ /local/siraj/inbox.php [QSA,L]
    RewriteRule ^messages/?$ /local/siraj/messages.php [QSA,L]
    RewriteRule ^profile/?$ /local/siraj/profile.php [QSA,L]
    RewriteRule ^team/?$ /local/siraj/team.php [QSA,L]
    RewriteRule ^people/?$ /local/siraj/person.php [QSA,L]
    RewriteRule ^people/([0-9]+)/?$ /local/siraj/person.php?id=$1 [QSA,L]
    RewriteRule ^teaching/?$ /local/siraj/teaching.php [QSA,L]
    RewriteRule ^studio/?$ /local/siraj/studio.php [QSA,L]
    RewriteRule ^reports/?$ /local/siraj/reports.php [QSA,L]
    RewriteRule ^matrix/?$ /local/siraj/matrix.php [QSA,L]
    # Moodle's own pages.
    RewriteRule ^calendar/(month|day|upcoming)/?$ /calendar/view.php?view=$1 [QSA,L]
    RewriteRule ^(assign|bigbluebuttonbn|book|choice|data|feedback|folder|forum|glossary|h5pactivity|imscp|lesson|lti|page|quiz|resource|scorm|url|wiki|workshop)/([0-9]+)/?$ /mod/$1/view.php?id=$2 [QSA,L]
    RewriteRule ^user/([0-9]+)/?$ /user/profile.php?id=$1 [QSA,L]
    RewriteRule ^admin/search/?$ /admin/search.php [QSA,L]
    # A settings page by its name (/admin/logos), unless that name is a real file or folder in /admin.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^admin/([a-z0-9_]+)/?$ /admin/settings.php?section=$1 [QSA,L]
</Directory>
